<!doctype html>
<html><head><meta charset="utf-8">
<!-- TEMPLATE DE CENA — copie para o projeto, troque tokens/textos/planos. Prévia: abra com ?dev=1 -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#F2EFE8;--ink:#121212;--accent:#E5372B;--muted:#8C8A84}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--bg)}
.layer{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.disp{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-0.045em;line-height:.9}
.ser{font-family:'Instrument Serif',serif;font-style:italic;letter-spacing:-0.01em;line-height:.95}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
svg{position:absolute;left:0;top:0;overflow:visible}
</style>
<script src="motion.js"></script>
</head><body><div id="stage"></div>
<script>
/* 1) TOKENS (direção de arte do projeto — nunca uma identidade fixa) */
const C = { bg: '#F2EFE8', ink: '#121212', accent: '#E5372B', muted: '#8C8A84' };
const { W, H, S, V } = M, E = M.ease, u = x => x * S, cx = W / 2, cy = H / 2;
const st = M.$('#stage');

/* 2) ROTEIRO (planos com sobreposição para transições) */
const P = M.shots([['titulo', 2.6], ['marca', 2.8]], { gap: -0.3 });
const DUR = P.end;

/* 3) SOM e BLUR (registrados na montagem, nunca dentro do render) */
M.cue(0.3, 'notes', { step: 0.05 });
M.cue(P.marca.start + 0.5, 'rise', { len: 0.8 }); M.cue(P.marca.start + 0.5, 'big'); M.cue(DUR - 1.2, 'end');
M.blur(P.titulo.end - 0.45, P.titulo.end, 12);            // saída rápida

/* 4) ELEMENTOS (criados uma vez) */
const L1 = M.el('div', { class: 'layer' }, st), L2 = M.el('div', { class: 'layer', style: { background: C.accent } }, st);
const title = M.el('div', { class: 'disp abs', style: { left: 0, width: W + 'px', top: '50%', textAlign: 'center', fontSize: u(V ? 150 : 200) + 'px', color: C.ink, transform: 'translateY(-50%)' } }, L1, 'Seu título aqui');
const g = M.el('svg', { width: W, height: H }, L2);
const mark = M.el('circle', { cx, cy: cy - u(V ? 120 : 40), r: u(110), fill: C.bg }, g);
const sign = M.el('div', { class: 'ser abs', style: { left: 0, width: W + 'px', textAlign: 'center', top: (cy + u(V ? 60 : 120)) + 'px', fontSize: u(96) + 'px', color: C.ink } }, L2, 'assinatura');
const grain = M.grain(st);
let T;                                                     // partes medidas depois das fontes

async function init() { T = M.split(title, { mask: 'lines' }); }

/* 5) RENDER — função pura de t */
function render(t) {
  grain.update(t);
  M.show(L1, M.on(t, P.titulo)); M.show(L2, M.on(t, P.marca));
  // título: linhas sobem de dentro da máscara (expo out), saem para cima (in cubic)
  T.lines.forEach((ln, i) => {
    const q = E.outExpo(M.seg(t, 0.2 + i * 0.1, 1.0 + i * 0.1));
    const o = E.inCubic(M.seg(t, P.titulo.end - 0.45 + i * 0.05, P.titulo.end - 0.1 + i * 0.05));
    M.css(ln.in, { transform: { y: (1 - q) * u(240) - o * u(260) } });
  });
  // marca: íris cobre a tela + forma entra com mola + assinatura
  const lt = M.lt(t, P.marca);
  const ir = E.inOutCubic(M.seg(lt, 0, 0.45));
  L2.style.clipPath = `circle(${M.expLerp(1, Math.hypot(W, H) / 2, ir)}px at 50% 50%)`;
  const s = M.springAt(lt, 0.4, 'bouncy');
  M.attr(mark, { r: u(110) * Math.max(0, s) });
  const sq = E.outExpo(M.seg(lt, 0.8, 1.5));
  M.css(sign, { opacity: sq, transform: { y: (1 - sq) * u(40) } });
}
M.boot(render, { dur: DUR, init });
</script></body></html>
